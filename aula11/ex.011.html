<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passaport</title>
</head>
<body>
    <h1>Portal da Regulamentação</h1>
    <p>Digite sua nacionalidade</p>
    <input type="text" name="txt" id="txt">
    <input type="button" value="Verificar" onclick="resultado()">
    <div id="res"></div>
    <script>
        function resultado(){
            var x = document.getElementById("txt");
            var txt = x.value;
            var result = document.getElementById("res");
            if(txt.toLowerCase() === "brasil"){
                result.innerHTML += "<p> Você é <strong>Brasileiro</strong> </p>";
            }else{
                result.innerHTML += "<p> Você é <strong>Estrangeiro</strong> </p>"; 
            }
        }
    </script>
</body>
</html>
